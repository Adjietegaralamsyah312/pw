<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login CRUD Management</title>

<style>
:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --danger:#dc2626;
    --danger-dark:#b91c1c;
    --success:#16a34a;
    --success-dark:#15803d;
    --gray:#64748b;
    --border:#d1d5db;
    --bg:#f8fafc;
    --white:#fff;
    --text:#0f172a;
    --muted:#475569;
    --shadow:0 10px 25px rgba(15, 23, 42, 0.08);
    --radius:14px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px;
    line-height:1.5;
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:var(--white);
    padding:24px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}

h1{
    font-size:1.8rem;
    margin-bottom:8px;
}

h2{
    font-size:1.35rem;
}

.subtitle{
    color:var(--muted);
    font-size:.95rem;
}

.login-box{
    max-width:420px;
    margin:72px auto 0;
}

.form-group{
    margin-bottom:14px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    font-size:.95rem;
}

input,select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    font-size:1rem;
    background:#fff;
    transition:border-color .2s, box-shadow .2s;
}

input:focus,select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37, 99, 235, .12);
}

button{
    border:none;
    cursor:pointer;
    padding:11px 16px;
    border-radius:10px;
    font-weight:600;
    font-size:.95rem;
    transition:transform .06s ease, background .2s ease, opacity .2s ease;
}

button:active{
    transform:translateY(1px);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-danger:hover{
    background:var(--danger-dark);
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-success:hover{
    background:var(--success-dark);
}

.btn-light{
    background:#e2e8f0;
    color:#0f172a;
}

.btn-light:hover{
    background:#cbd5e1;
}

.hidden{
    display:none !important;
}

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.toolbar-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.table-card{
    padding:0;
    overflow:hidden;
}

.table-wrapper{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
}

th,td{
    padding:14px 16px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    vertical-align:middle;
}

th{
    background:#f8fafc;
    color:#334155;
    font-size:.82rem;
    text-transform:uppercase;
    letter-spacing:.04em;
}

tr:hover td{
    background:#fafafa;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 10px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:700;
    border:1px solid transparent;
}

.badge-admin{
    background:#fef2f2;
    color:#991b1b;
    border-color:#fee2e2;
}

.badge-user{
    background:#ecfdf5;
    color:#166534;
    border-color:#d1fae5;
}

.badge-unknown{
    background:#f1f5f9;
    color:#334155;
    border-color:#e2e8f0;
}

.helper{
    margin-top:8px;
    color:var(--muted);
    font-size:.9rem;
}

.notice{
    margin-top:14px;
    padding:12px 14px;
    border-radius:12px;
    background:#eff6ff;
    color:#1e3a8a;
    border:1px solid #dbeafe;
    font-size:.92rem;
}

.error{
    background:#fef2f2;
    color:#991b1b;
    border-color:#fee2e2;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15, 23, 42, .5);
    display:none;
    justify-content:center;
    align-items:center;
    padding:16px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:white;
    width:100%;
    max-width:520px;
    border-radius:16px;
    padding:22px;
    box-shadow:0 30px 60px rgba(0,0,0,.2);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
}

.icon-btn{
    background:#e2e8f0;
    color:#0f172a;
    width:40px;
    height:40px;
    border-radius:10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
}

.icon-btn:hover{
    background:#cbd5e1;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

@media (max-width:768px){
    body{
        padding:14px;
    }

    .card{
        padding:18px;
    }

    h1{
        font-size:1.5rem;
    }

    table{
        min-width:700px;
    }

    .login-box{
        margin-top:28px;
    }
}
</style>
</head>
<body>

<div class="container">

    <!-- LOGIN -->
    <section id="loginSection" class="card login-box">
        <h1>Login</h1>
        <p class="subtitle">Masuk untuk mengelola data user.</p>

        <form id="loginForm" autocomplete="off">
            <div class="form-group" style="margin-top:18px;">
                <label for="loginUsername">Username</label>
                <input id="loginUsername" type="text" placeholder="Masukkan username" required />
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" placeholder="Masukkan password" required />
            </div>

            <button class="btn-primary" type="submit" style="width:100%;">
                Login
            </button>
        </form>

        <div id="loginNotice" class="notice" style="display:none;"></div>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard" class="hidden">
        <div class="toolbar">
            <div>
                <h1>Kelola User</h1>
                <p class="subtitle">CRUD sederhana dengan data awal dari <code>users.json</code>.</p>
            </div>

            <div class="toolbar-actions">
                <button class="btn-success" id="addBtn">+ Tambah User</button>
                <button class="btn-light" id="refreshBtn">Refresh</button>
                <button class="btn-danger" id="logoutBtn">Logout</button>
            </div>
        </div>

        <div class="card table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="userTable"></tbody>
                </table>
            </div>
        </div>
    </section>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Tambah User</h2>
            <button type="button" class="icon-btn" id="closeModalBtn" aria-label="Tutup modal">×</button>
        </div>

        <form id="userForm" autocomplete="off">
            <input type="hidden" id="userId" />

            <div class="form-group">
                <label for="formNama">Nama</label>
                <input id="formNama" type="text" placeholder="Nama lengkap" required />
            </div>

            <div class="form-group">
                <label for="formUsername">Username</label>
                <input id="formUsername" type="text" placeholder="Username login" required />
            </div>

            <div class="form-group">
                <label for="formEmail">Email</label>
                <input id="formEmail" type="email" placeholder="email@domain.com" required />
            </div>

            <div class="form-group">
                <label for="formPassword">Password</label>
                <input id="formPassword" type="password" placeholder="Password login" required />
            </div>

            <div class="form-group">
                <label for="formRole">Role</label>
                <select id="formRole" required>
                    <option value="Admin">Admin</option>
                    <option value="User">User</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-light" id="cancelBtn">Batal</button>
                <button type="submit" class="btn-primary">Simpan</button>
            </div>
        </form>
    </div>
</div>

<script>
const DEFAULT_USERS = [
    {
        id: 1,
        nama: "Administrator",
        username: "admin",
        email: "admin@mail.com",
        password: "admin123",
        role: "Admin"
    },
    {
        id: 2,
        nama: "John Doe",
        username: "johndoe",
        email: "john@mail.com",
        password: "john123",
        role: "User"
    }
];

const $ = (id) => document.getElementById(id);

const Service = {
    STORAGE_KEY: "users_db",
    SEED_URL: "./users.json",

    async init() {
        if (!localStorage.getItem(this.STORAGE_KEY)) {
            try {
                const response = await fetch(this.SEED_URL, { cache: "no-store" });

                if (!response.ok) {
                    throw new Error(`Gagal fetch ${this.SEED_URL} (${response.status})`);
                }

                const users = await response.json();
                this.saveUsers(users);
            } catch (error) {
                console.error("Init data gagal:", error);
                this.saveUsers(DEFAULT_USERS);
                UI.showLoginNotice("users.json tidak ditemukan, memakai data bawaan sementara.");
            }
        }
    },

    getUsers() {
        try {
            return JSON.parse(localStorage.getItem(this.STORAGE_KEY)) || [];
        } catch {
            return [];
        }
    },

    saveUsers(users) {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(users));
    },

    nextId(users) {
        if (!users.length) return 1;
        return Math.max(...users.map(u => Number(u.id) || 0)) + 1;
    },

    create(user) {
        const users = this.getUsers();
        user.id = this.nextId(users);
        users.push(user);
        this.saveUsers(users);
    },

    update(user) {
        const users = this.getUsers();
        const index = users.findIndex(u => Number(u.id) === Number(user.id));
        if (index === -1) return false;
        users[index] = { ...users[index], ...user, id: Number(user.id) };
        this.saveUsers(users);
        return true;
    },

    delete(id) {
        const users = this.getUsers().filter(u => Number(u.id) !== Number(id));
        this.saveUsers(users);
    },

    login(username, password) {
        return this.getUsers().find(
            user => user.username === username && user.password === password
        );
    }
};

const UI = {
    userTable: $("userTable"),
    loginSection: $("loginSection"),
    dashboard: $("dashboard"),
    modal: $("modal"),
    modalTitle: $("modalTitle"),
    loginNotice: $("loginNotice"),

    render() {
        const users = Service.getUsers();

        if (!users.length) {
            this.userTable.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center; color:#64748b; padding:20px;">
                        Belum ada data user.
                    </td>
                </tr>
            `;
            return;
        }

        this.userTable.innerHTML = users.map(user => {
            const roleClass =
                user.role === "Admin" ? "badge-admin" :
                user.role === "User" ? "badge-user" :
                "badge-unknown";

            return `
                <tr>
                    <td>${user.id}</td>
                    <td>${escapeHtml(user.nama || "-")}</td>
                    <td>${escapeHtml(user.username || "-")}</td>
                    <td>${escapeHtml(user.email || "-")}</td>
                    <td><span class="badge ${roleClass}">${escapeHtml(user.role || "-")}</span></td>
                    <td>
                        <div class="actions">
                            <button type="button" class="btn-light" data-action="edit" data-id="${user.id}">Edit</button>
                            <button type="button" class="btn-danger" data-action="delete" data-id="${user.id}">Hapus</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join("");
    },

    openModal(title = "Tambah User") {
        this.modalTitle.textContent = title;
        this.modal.classList.add("show");
    },

    closeModal() {
        this.modal.classList.remove("show");
        $("userForm").reset();
        $("userId").value = "";
        $("formRole").value = "User";
    },

    fillForm(user) {
        $("userId").value = user.id;
        $("formNama").value = user.nama || "";
        $("formUsername").value = user.username || "";
        $("formEmail").value = user.email || "";
        $("formPassword").value = user.password || "";
        $("formRole").value = user.role || "User";
    },

    showLoginNotice(message, isError = false) {
        this.loginNotice.style.display = "block";
        this.loginNotice.textContent = message;
        this.loginNotice.classList.toggle("error", isError);
    },

    hideLoginNotice() {
        this.loginNotice.style.display = "none";
        this.loginNotice.textContent = "";
        this.loginNotice.classList.remove("error");
    },

    showDashboard() {
        this.loginSection.classList.add("hidden");
        this.dashboard.classList.remove("hidden");
    },

    showLogin() {
        this.dashboard.classList.add("hidden");
        this.loginSection.classList.remove("hidden");
    }
};

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}

function getFormData() {
    return {
        id: $("userId").value ? Number($("userId").value) : null,
        nama: $("formNama").value.trim(),
        username: $("formUsername").value.trim(),
        email: $("formEmail").value.trim(),
        password: $("formPassword").value,
        role: $("formRole").value
    };
}

function validateUser(user) {
    if (!user.nama || !user.username || !user.email || !user.password || !user.role) {
        return "Semua field wajib diisi.";
    }

    const users = Service.getUsers();
    const editingId = user.id;

    const usernameExists = users.some(u =>
        u.username.toLowerCase() === user.username.toLowerCase() &&
        Number(u.id) !== Number(editingId)
    );

    const emailExists = users.some(u =>
        u.email.toLowerCase() === user.email.toLowerCase() &&
        Number(u.id) !== Number(editingId)
    );

    if (usernameExists) return "Username sudah dipakai.";
    if (emailExists) return "Email sudah dipakai.";

    return "";
}

async function initApp() {
    await Service.init();
    UI.render();

    $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const username = $("loginUsername").value.trim();
        const password = $("loginPassword").value;

        const user = Service.login(username, password);

        if (!user) {
            UI.showLoginNotice("Login gagal. Username atau password salah.", true);
            return;
        }

        sessionStorage.setItem("currentUser", JSON.stringify({
            id: user.id,
            nama: user.nama,
            username: user.username,
            role: user.role
        }));

        UI.hideLoginNotice();
        UI.showDashboard();
        UI.render();
    });

    $("logoutBtn").addEventListener("click", () => {
        sessionStorage.removeItem("currentUser");
        UI.showLogin();
        $("loginPassword").value = "";
        $("loginUsername").focus();
    });

    $("addBtn").addEventListener("click", () => {
        UI.openModal("Tambah User");
    });

    $("refreshBtn").addEventListener("click", () => {
        UI.render();
    });

    $("closeModalBtn").addEventListener("click", () => UI.closeModal());
    $("cancelBtn").addEventListener("click", () => UI.closeModal());

    $("modal").addEventListener("click", (e) => {
        if (e.target === $("modal")) UI.closeModal();
    });

    $("userForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const user = getFormData();
        const validationMessage = validateUser(user);

        if (validationMessage) {
            alert(validationMessage);
            return;
        }

        if (user.id) {
            const ok = Service.update(user);
            if (!ok) {
                alert("Data user tidak ditemukan.");
                return;
            }
        } else {
            Service.create(user);
        }

        UI.render();
        UI.closeModal();
    });

    $("userTable").addEventListener("click", (e) => {
        const action = e.target.dataset.action;
        const id = e.target.dataset.id;
        if (!action || !id) return;

        const user = Service.getUsers().find(u => Number(u.id) === Number(id));
        if (!user) return;

        if (action === "edit") {
            UI.fillForm(user);
            UI.openModal("Edit User");
        }

        if (action === "delete") {
            const confirmDelete = confirm(`Hapus user "${user.username}"?`);
            if (!confirmDelete) return;

            Service.delete(id);
            UI.render();
        }
    });

    // Auto-login kalau ada session
    const currentUser = sessionStorage.getItem("currentUser");
    if (currentUser) {
        UI.showDashboard();
    } else {
        UI.showLogin();
    }
}

document.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
</html>
